<div class="actions" [formGroup]="forms">
  <div>
    <input formControlName="reloadSelectors" type="checkbox" id="reloadSelectors" />
    <label for="reloadSelectors">Reload selectors</label>
  </div>

  <div>
    <input formControlName="resetQueries" type="checkbox" id="resetQueries" />
    <label for="resetQueries">Reset queries</label>
  </div>

  <div>
    <input formControlName="reloadIdentifiers" type="checkbox" id="reloadIdentifiers" />
    <label for="reloadIdentifiers">Reload identifiers</label>
  </div>

  <button (click)="update()">Update</button>
  <div></div>
</div>
